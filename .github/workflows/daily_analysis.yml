name: Daily Stock Analysis

on:
  schedule:
    - cron: '47 15 * * *'  # 毎日 15:47 UTC (00:47 JST)
    - cron: '52 15 * * *'  # 毎日 15:52 UTC (00:52 JST)
    - cron: '57 15 * * *'  # 毎日 15:57 UTC (00:57 JST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        run: python analyze.py

      - name: Build mkdocs site
        run: mkdocs build

      - name: Commit generated reports/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "No updates to commit"
          else
            git commit -m "Daily analysis reports $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
