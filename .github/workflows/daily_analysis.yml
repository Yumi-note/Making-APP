name: Daily Stock Analysis

on:
  schedule:
    - cron: '17 15 * * *'  # 毎日 15:17 UTC (00:17 JST)
    - cron: '22 15 * * *'  # 毎日 15:22 UTC (00:22 JST)
    - cron: '27 15 * * *'  # 毎日 15:27 UTC (00:27 JST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        run: python analyze.py

      - name: Build mkdocs site
        run: mkdocs build

      - name: Commit generated reports/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "No updates to commit"
          else
            git commit -m "Daily analysis reports $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
